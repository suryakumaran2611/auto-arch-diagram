name: Architecture Diagram

on:
  push:
    branches: [main, develop]
    paths:
      - 'integration_example/**/*.tf'
      - 'integration_example/**/*.tfvars'
      - '.auto-arch-diagram.yml'
      - '.github/workflows/architecture.yml'
  pull_request:
    paths:
      - 'integration_example/**/*.tf'
      - 'integration_example/**/*.tfvars'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagram:
    uses: suryakumaran2611/auto-arch-diagram/.github/workflows/reusable-auto-arch-diagram.yml@main
    with:
      iac_root: integration_example
      out_dir: integration_example/docs
      image_formats: png,jpg,svg
      direction: AUTO
      render_layout: lanes
      render_bg: transparent
      comment_on_pr: true
      publish_enabled: true
      # AI refinement — set to true + add OPENROUTER_API_KEY secret for *-ai.* outputs
      # Uses free stealth/ox-alpha by default (no credit needed, 50/day free tier)
      ai_enhance: false
      ai_backend: openrouter
      openrouter_model: stealth/ox-alpha
      force_full: false
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
      CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USER }}
      CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}

  publish-confluence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: diagram
    uses: suryakumaran2611/auto-arch-diagram/.github/workflows/reusable-auto-arch-diagram.yml@main
    with:
      iac_root: integration_example
      out_dir: integration_example/docs
      image_formats: png,jpg,svg
      publish_enabled: true
      publish_confluence: true
      confluence_page_id: ${{ vars.CONFLUENCE_PAGE_ID }}
      confluence_replace: true
      confluence_unique_filename: true
    secrets:
      CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
      CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USER }}
      CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
