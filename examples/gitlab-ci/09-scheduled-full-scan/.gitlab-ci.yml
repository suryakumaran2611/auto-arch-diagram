# 09 — Scheduled full scan
#
# Runs on Pipeline Schedules only, regenerating every tracked IaC file.
# Full walkthrough: README.md
# ---------------------------------------------------------------------------
stages:
  - build

# Pinned to v2.1.3. Not sure which version to use? Reference @main instead - see README.md.
include:
  - component: $CI_SERVER_FQDN/platform/auto-arch-diagram/auto-arch-diagram@2.1.3
    inputs:
      iac-root: infra
      out-dir: artifacts/architecture
      image-formats: png,svg,drawio,html
      force-full: true
      always-run: true
      mr-comment: false
      artifacts-expire-in: 30 days

# The component adds a rule for every pipeline; narrow the job to schedules.
auto-arch-diagram:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
