# 07 — OpenRouter free models
#
# Requires a masked OPENROUTER_API_KEY. The client ranks the live $0 + vision
# catalog at runtime; leave `openrouter-model` empty to use that ranking.
# Full walkthrough: README.md
# ---------------------------------------------------------------------------
stages:
  - build

# Pinned to v2.1.3. Not sure which version to use? Reference @main instead - see README.md.
include:
  - component: $CI_SERVER_FQDN/platform/auto-arch-diagram/auto-arch-diagram@2.1.3
    inputs:
      iac-root: infra
      out-dir: artifacts/openrouter
      image-formats: png,svg,drawio,html

      ai-enhance: true
      ai-backend: openrouter
      # Empty = live free-vision ranking. Pin only a current $0 vision model.
      openrouter-model: ''
      ai-iterations: '2'

      # No merge request note in this example.
      mr-comment: false
